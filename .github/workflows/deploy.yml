# file: /.github/workflows/deploy.yml v2 - set -euo pipefail so a failed build stops the deploy;
#   pm2 restart --update-env
# v1 - git pull, npm install, build, pm2 restart on push to main
name: Deploy Patriot Thanks

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            set -euo pipefail
            cd /var/www/patriotthanks.com
            git pull origin main
            npm install
            npm run build
            pm2 restart patriotthanks --update-env